{% extends "base.html" %}

{% block title %}Crear cuenta | Basura Cero Guía{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-card">

        <div class="text-center mb-4">
            <div class="feature-icon mx-auto">🌱</div>
            <h1 class="auth-title">Crear una cuenta</h1>
            <p class="auth-subtitle">
                Formá parte de una comunidad que cuida el ambiente.
            </p>
        </div>

        <div class="info-box">
            🌿 El primer usuario registrado será el Administrador.
        </div>

        <form method="POST">

            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    placeholder="Elegí un nombre de usuario"
                    required
                    autocomplete="username">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Creá una contraseña"
                    required
                    autocomplete="new-password">
            </div>

            <button type="submit" class="btn btn-primary-custom">
                Crear mi cuenta →
            </button>

        </form>

        <p class="text-center mt-4 mb-0">
            ¿Ya tenés una cuenta?
            <a href="{{ url_for('login') }}" class="auth-link">Iniciá sesión</a>
        </p>

    </div>
</section>

{% endblock %}
